name: Retry release publication
run-name: Retry Local Notion publication from run ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original completed tagged release workflow run ID
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  publish:
    if: github.repository == 'Sphere10/LocalNotion' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: localnotion-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Command resolution regression
        run: |
          ./tests/release-command-resolution.ps1
          ./tests/release-draft-discovery.ps1
      - name: Verify original tagged build and all successful tests
        id: original
        run: |
          if ($env:ORIGINAL_RUN_ID -cnotmatch '^[1-9][0-9]{0,19}$') { throw 'Supply a numeric Actions run ID.' }
          $run = (& gh api "repos/Sphere10/LocalNotion/actions/runs/$env:ORIGINAL_RUN_ID" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the original workflow run.' }
          if ($run.path -cne '.github/workflows/release.yml' -or $run.event -cne 'push' -or $run.status -cne 'completed' -or $run.head_branch -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' -or $run.head_sha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Recovery requires a completed tagged run of the official release workflow.'
          }
          & git merge-base --is-ancestor $run.head_sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The original release commit must belong to the official default branch history.' }
          $jobs = (& gh api "repos/Sphere10/LocalNotion/actions/runs/$env:ORIGINAL_RUN_ID/jobs?filter=latest&per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the original job results.' }
          $platforms = Get-Content ./build/platforms.json -Raw | ConvertFrom-Json
          $requiredJobs = @('metadata', 'Build and test Docker') + @($platforms.include | ForEach-Object { "Package $($_.rid)" })
          foreach ($name in $requiredJobs) {
            $matching = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($matching.Count -ne 1 -or $matching[0].conclusion -cne 'success') { throw "The original $name job must have passed." }
          }
          $version = $run.head_branch.Substring(1)
          @("version=$version", "build_number=$($run.run_number)", "sha=$($run.head_sha)") | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Recovering $version build $($run.run_number), commit $($run.head_sha), from run $env:ORIGINAL_RUN_ID."
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: Sphere10/LocalNotion
          run-id: ${{ inputs.run_id }}
          pattern: native-*
          merge-multiple: true
          path: publish/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: Sphere10/LocalNotion
          run-id: ${{ inputs.run_id }}
          name: docker-launcher
          path: publish/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: Sphere10/LocalNotion
          run-id: ${{ inputs.run_id }}
          name: tested-docker-image
          path: publish
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the original tested artifacts with the current publisher
        env:
          RELEASE_VERSION: ${{ steps.original.outputs.version }}
          BUILD_NUMBER: ${{ steps.original.outputs.build_number }}
          SOURCE_REVISION: ${{ steps.original.outputs.sha }}
        run: |
          ./build/publish-github-release.ps1 -Version $env:RELEASE_VERSION -BuildNumber $env:BUILD_NUMBER -SourceRevisionId $env:SOURCE_REVISION -ArtifactsDirectory ./publish/artifacts -DockerArchive ./publish/docker-image.tar
