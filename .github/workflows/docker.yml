name: Official Local Notion Docker

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (requires approved image naming)
        type: boolean
        required: true
        default: false
      version:
        description: Image tag and OCI version (for example, 1.2.3)
        type: string
        required: true
        default: dev
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - compose*.yml
      - compose*.yaml
      - docker/**
      - LocalNotion.CLI/**
      - LocalNotion.Core/**
      - Notion.Client/**
      - LocalNotion.sln
      - Directory.Build.*
      - Directory.Packages.props
      - NuGet.Config
      - nuget.config
      - global.json

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Build and smoke-test linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate image metadata
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version || 'dev' }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Version must be a valid Docker image tag (1-128 characters).'
            exit 1
          fi
          printf 'image=ghcr.io/sphere10/local-notion\n' >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local-notion:smoke-test
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke-test CLI without credentials
        timeout-minutes: 2
        run: |
          help_exit=0
          help_output="$(docker run --rm --network none local-notion:smoke-test --help 2>&1)" || help_exit=$?
          printf '%s\n' "$help_output"
          # The current CLI returns -2 (254 on Linux) for help requests.
          if [[ "$help_exit" != 0 && "$help_exit" != 254 ]]; then
            exit "$help_exit"
          fi
          grep -Eq '(^|[[:space:]])init([[:space:]]|$)' <<< "$help_output"
          grep -Eq '(^|[[:space:]])pull([[:space:]]|$)' <<< "$help_output"
          version_output="$(docker run --rm --network none local-notion:smoke-test --version 2>&1)"
          printf '%s\n' "$version_output"
          grep -Eq '[0-9]+\.[0-9]+\.[0-9]+' <<< "$version_output"

  publish:
    name: Publish approved image to GHCR
    needs: validate
    # Official publishing requires an explicit manual run in the canonical repository.
    if: >-
      github.repository == 'Sphere10/LocalNotion' &&
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke-test the exact image to be published
        timeout-minutes: 2
        run: |
          help_exit=0
          help_output="$(docker run --rm --network none "$IMAGE:$VERSION" --help 2>&1)" || help_exit=$?
          printf '%s\n' "$help_output"
          # The current CLI returns -2 (254 on Linux) for help requests.
          if [[ "$help_exit" != 0 && "$help_exit" != 254 ]]; then
            exit "$help_exit"
          fi
          grep -Eq '(^|[[:space:]])init([[:space:]]|$)' <<< "$help_output"
          grep -Eq '(^|[[:space:]])pull([[:space:]]|$)' <<< "$help_output"
          version_output="$(docker run --rm --network none "$IMAGE:$VERSION" --version 2>&1)"
          printf '%s\n' "$version_output"
          grep -Eq '[0-9]+\.[0-9]+\.[0-9]+' <<< "$version_output"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image and record digest
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          printf 'Published %s:%s and %s:sha-%s.\n\n' "$IMAGE" "$VERSION" "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Pin deployments to %s for this exact image.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"